name: galerie
services:
  # application
  galerie:
    image: ghcr.io/sekai-soft/galerie:latest
    container_name: galerie
    restart: unless-stopped
    environment:
      BASE_URL: 'https://galerie-reader.app'
      SQLALCHEMY_DATABASE_URI: 'postgresql://galerie:secret@galerie-postgres/galerie?sslmode=disable'
      MINIFLUX_BASE_URL: 'http://miniflux'
      NITTER_BASE_URL: 'http://nitter'
      MEDIA_PROXY_CUSTOM_URL: 'http://galerie-reader-media'
    env_file:
      - env
    depends_on:
      galerie-ts:
        condition: service_healthy
    network_mode: service:galerie-ts
  galerie-ts:
    image: tailscale/tailscale:latest
    container_name: galerie-ts
    restart: unless-stopped
    hostname: galerie
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - galerie-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # postgres
  postgres:
    image: postgres:15
    container_name: galerie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=galerie
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=galerie
    volumes:
      - postgres:/var/lib/postgresql/data
    depends_on:
      postgres-ts:
        condition: service_healthy
    network_mode: service:postgres-ts
  postgres-ts:
    image: tailscale/tailscale:latest
    container_name: galerie-postgres-ts
    restart: unless-stopped
    hostname: galerie-postgres
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - postgres-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true
  postgres-backup:
    image: ghcr.io/sekai-soft/postgres-backup-s3:15
    container_name: galerie-postgres-backup
    restart: unless-stopped
    env_file:
      - env-backup
      - $HOME/env-backup
    environment:
      S3_PREFIX: 'galerie'
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      POSTGRES_HOST: galerie-postgres
      POSTGRES_DATABASE: galerie
      POSTGRES_USER: galerie
      POSTGRES_PASSWORD: secret

  # miniflux
  miniflux:
    image: miniflux/miniflux:2.3.2
    container_name: galerie-miniflux
    restart: unless-stopped
    depends_on:
      miniflux-postgres:
        condition: service_healthy
      miniflux-ts:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:secret@miniflux-postgres/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - PORT=80
      - BASE_URL=http://miniflux/
      - WORKER_POOL_SIZE=1
      - MEDIA_PROXY_CUSTOM_URL=http://galerie-reader-media
      - MEDIA_PROXY_RESOURCE_TYPES=image,audio,video
      - FETCHER_ALLOW_PRIVATE_NETWORKS=1
      - HTTP_CLIENT_TIMEOUT=120
      - POLLING_PARSING_ERROR_LIMIT=0
    env_file:
      - env
    network_mode: service:miniflux-ts
  miniflux-ts:
    image: tailscale/tailscale:latest
    container_name: galerie-miniflux-ts
    restart: unless-stopped
    hostname: miniflux
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - miniflux-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

  miniflux-postgres:
    image: postgres:15
    container_name: galerie-miniflux-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=miniflux
    volumes:
      - miniflux-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
  miniflux-postgres-backup:
    image: ghcr.io/sekai-soft/postgres-backup-s3:15
    container_name: galerie-miniflux-postgres-backup
    restart: unless-stopped
    env_file:
      - env-backup-miniflux
      - $HOME/env-backup
    environment:
      S3_PREFIX: 'galerie-miniflux'
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      POSTGRES_HOST: miniflux-postgres
      POSTGRES_DATABASE: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: secret

volumes:
  galerie-ts:
  postgres:
  postgres-ts:
  miniflux-ts:
  miniflux-postgres:
